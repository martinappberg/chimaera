name: ci

# `push: [main]` is not redundant with the PR run: `main` doesn't require
# branches to be up to date, so a merge can land a tree no PR run tested. It
# is the release gate: release.yml ships only a main commit this run passed
# on. And it is the ONLY writer of the base-branch Rust caches every PR
# restores from. rust-cache keys on job name, so release.yml's `daemon`/`app`
# jobs never populate `rust`/`musl`. Delete this trigger and nothing
# releases, and every PR pays a cold clippy+test build.
on:
  push:
    branches: [main]
  pull_request:

# A superseded PR run is worthless: cancel it the moment a new commit lands.
# A running main push is never cancelled — it primes the caches described
# above. A main push still waiting for one is replaced by the next merge's
# (a group holds one pending run), so a commit merged right behind another
# may get no run of its own; the later commit's run covers its tree.
# The group is per-workflow, so this can never interfere with release.yml
# (which runs on a schedule and owns the `release-<ref>` groups).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Hold the Ubuntu 24 baseline while validating Ubuntu 26 before switching both
# CI and release. Exit criteria: docs/agent-guides/releases.md#linux-runner-migration.
jobs:
  ui:
    needs: ui-build
    # A failed asset build must fail the required `ui` check, not skip it.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful UI build
        env:
          UI_BUILD_RESULT: ${{ needs.ui-build.result }}
        run: test "$UI_BUILD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run check
        working-directory: web-ui
      - run: npm run test
        working-directory: web-ui

  # Rust only needs the built assets. Let compilation overlap UI validation;
  # the required `ui` check and the full main CI run still gate shipping.
  ui-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist

  # Fast repo-hygiene checks, no build needed: the release semver decision
  # (the most behavior-critical release piece), the destructive-command guard,
  # worktree-gc's deletion rules, docs, agent-asset parity, the feature
  # registry (every page, path, map and rule it names exists), and dependency
  # direction (crates and shared UI layers never import upward). jq is
  # preinstalled on ubuntu-24.04.
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bash scripts/version-bump.test.sh
      - run: bash .claude/hooks/guard-bash.test.sh
      - run: bash scripts/worktree-gc.test.sh
      - run: node scripts/check-doc-links.mjs
      - run: node scripts/check-site.mjs
      - run: node scripts/check-agent-assets.mjs
      - run: node scripts/check-feature-registry.mjs
      - run: node scripts/check-dependency-direction.mjs
      - run: bash .claude/hooks/doc-drift.test.sh
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check-workflow-security.mjs
      - run: node --test .github/scripts/*.test.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust:
    needs: ui-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist
      # No toolchain arg: rustup installs the channel + components pinned in
      # rust-toolchain.toml, so CI lints against the same compiler as local.
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Main saves, PRs restore. A PR-scoped cache is unreadable by every
        # other PR, yet still consumes the repo's 10 GiB LRU cache quota — left
        # unchecked it evicts the very main entries this job exists to prime.
        with:
          key: ubuntu-24.04
          workspaces: |
            .
            plugins
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What chimaera-server's TEST build embeds and installs: plugins/dist-test
      # (the fixture, built from the plugins/ cargo workspace, and the releases
      # plugins/plugins.lock pins, downloaded and checksum-verified). The
      # daemon itself carries no plugins, so the musl job doesn't need it.
      - run: bash scripts/build-plugins.sh
      - run: cargo fmt --all --check
      - run: cargo fmt --all --manifest-path plugins/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path plugins/Cargo.toml --all-targets -- -D warnings
      # Check mode: a committed daemon↔UI wire fixture (web-ui/src/lib/net/
      # fixtures/wire) that no longer matches what the Rust shapes serialize
      # fails its test instead of being rewritten (crates/chimaera-wire-fixtures).
      - run: cargo test --workspace
        env:
          CHIMAERA_WIRE_FIXTURES: check
      - run: cargo test --manifest-path plugins/Cargo.toml

  # The native Windows daemon: the compile/lint/test gate for every
  # cfg(windows) path (macOS cannot link them), then a live smoke of the real
  # chimaera.exe -- start, authenticate, round-trip a PowerShell PTY, stop via
  # the session-preserving /api/v1/stop and require the process to exit.
  windows:
    needs: ui-build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-latest
          workspaces: |
            .
            plugins
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Git Bash ships on the runner; the script is the same one the rust job runs.
      - run: bash scripts/build-plugins.sh
        shell: bash
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          CHIMAERA_WIRE_FIXTURES: check
      - name: Native daemon smoke
        shell: pwsh
        run: |
          cargo build -p chimaera
          $env:CHIMAERA_HOME = Join-Path $env:RUNNER_TEMP 'chimaera-home'
          $workspace = Join-Path $env:RUNNER_TEMP 'smoke-workspace'
          New-Item -ItemType Directory -Force $env:CHIMAERA_HOME, $workspace | Out-Null
          $daemon = Start-Process -FilePath (Resolve-Path target/debug/chimaera.exe) `
            -ArgumentList 'serve' -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'daemon.out') `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'daemon.err')
          $manifest = Join-Path $env:CHIMAERA_HOME 'data/manifest.json'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $manifest)) {
            if ($daemon.HasExited -or (Get-Date) -gt $deadline) {
              Get-Content (Join-Path $env:RUNNER_TEMP 'daemon.err') -ErrorAction SilentlyContinue
              throw 'daemon did not write its manifest'
            }
            Start-Sleep -Milliseconds 250
          }
          # --stop ends with POST /api/v1/stop; the process must then exit by itself.
          node scripts/smoke-daemon.mjs $manifest $workspace --stop
          if ($LASTEXITCODE -ne 0) {
            $daemon.Kill()
            Get-Content (Join-Path $env:RUNNER_TEMP 'daemon.err') -ErrorAction SilentlyContinue
            throw 'smoke failed'
          }
          if (-not $daemon.WaitForExit(15000)) {
            $daemon.Kill()
            throw 'daemon still running 15 s after /api/v1/stop'
          }
          Write-Host "daemon exited with code $($daemon.ExitCode)"

  musl:
    needs: ui-build
    runs-on: ubuntu-24.04
    # This gate proves the static cross-build compiles and links; the binaries
    # users get are built by release.yml. So it skips the `release` profile's
    # fat LTO and single codegen unit, whose whole-program link dominates the
    # build. Job-level on purpose: rust-cache hashes CARGO* env into its key.
    # Set on the build step alone, the key would stay the LTO build's, and
    # restore dependencies built as LTO bitcode this build cannot reuse.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist
      # rust-toolchain.toml pins the channel and both musl targets.
      - run: rustup show
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # Keep aligned with release.yml; otherwise this action selects latest.
          version: 0.17.0
          cache-key: ubuntu-24.04-${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One cache per target. rust-cache keys on the job name, not the
          # matrix, so without this both legs share one entry: whichever
          # saves first wins, and the other leg restores it and recompiles
          # its whole target dependency tree (wasmtime, cranelift, tokio).
          key: ubuntu-24.04-${{ matrix.target }}-zig-0.17.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-zigbuild --locked --version 0.23.4
      - run: cargo zigbuild --release --target ${{ matrix.target }} -p chimaera
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chimaera-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/chimaera
