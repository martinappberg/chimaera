name: ci

# `push: [main]` looks redundant with the PR run — squash-merging an up-to-date
# branch lands a byte-identical tree, so it re-tests something already green.
# Keep it anyway: it is the ONLY writer of the base-branch Rust caches every PR
# restores from. rust-cache keys on job name, so release.yml's `daemon`/`app`
# jobs never populate `rust`/`musl`. Delete this trigger and every PR pays a
# cold clippy+test build.
on:
  push:
    branches: [main]
  pull_request:

# A superseded PR run is worthless: cancel it the moment a new commit lands.
# Pushes to main are never cancelled — they prime the caches described above.
# The group is per-workflow, so this can never interfere with release.yml
# (which triggers independently on push:[main] and owns the `release` group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run check
        working-directory: web-ui
      - run: npm run test
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-ui-dist
          path: web-ui/dist

  # Fast repo-hygiene checks, no build needed: the release semver decision
  # (the most behavior-critical release piece), the destructive-command guard,
  # worktree-gc's deletion rules, docs, and agent-asset parity. jq is
  # preinstalled on ubuntu-latest.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bash scripts/version-bump.test.sh
      - run: bash .claude/hooks/guard-bash.test.sh
      - run: bash scripts/worktree-gc.test.sh
      - run: node scripts/check-doc-links.mjs
      - run: node scripts/check-site.mjs
      - run: node scripts/check-agent-assets.mjs
      - run: node scripts/check-workflow-security.mjs
      - run: node --test .github/scripts/*.test.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust:
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-ui-dist
          path: web-ui/dist
      # No toolchain arg: rustup installs the channel + components pinned in
      # rust-toolchain.toml, so CI lints against the same compiler as local.
      - run: rustup show
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        # Main saves, PRs restore. A PR-scoped cache is unreadable by every
        # other PR, yet still consumes the repo's 10 GiB LRU cache quota — left
        # unchecked it evicts the very main entries this job exists to prime.
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What chimaera-server's TEST build embeds and installs: plugins/dist-test
      # (the fixture, built from the plugins/ cargo workspace, and the releases
      # plugins/plugins.lock pins, downloaded and checksum-verified). The
      # daemon itself carries no plugins, so the musl job doesn't need it.
      - run: bash scripts/build-plugins.sh
      - run: cargo fmt --all --check
      - run: cargo fmt --all --manifest-path plugins/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path plugins/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p chimaera-link --all-features
      - name: Check explicit personal-provider helper
        run: cargo clippy --locked -p chimaera -p chimaera-server --all-targets --features provider-github-fixture,provider-claude-fixture -- -D warnings
      - name: Test explicit personal-provider helper
        run: |
          cargo test --locked -p chimaera-server --lib --features provider-github-fixture,provider-claude-fixture cloud::providers
          cargo test --locked -p chimaera-server --lib --features provider-github-fixture,provider-claude-fixture pro::execution::
          cargo test --locked -p chimaera --features provider-github-fixture,provider-claude-fixture
      - name: Verify pinned GitHub CLI ignores project endpoint configuration
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/chimaera-gh-2.102.0"
          mkdir -p "$fixture_root"
          # Same official release asset/digest as the private worker image.
          curl --proto '=https' --tlsv1.2 --max-time 60 --max-filesize 33554432 -fsSL \
            -o "$fixture_root/gh.deb" https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.deb
          printf '%s  %s\n' 7e54a307f90afdc59796c325ec0c49fb09e6c18537727207a8ac7513584ea5b0 "$fixture_root/gh.deb" | sha256sum -c -
          dpkg-deb --extract "$fixture_root/gh.deb" "$fixture_root/extracted"
          CHIMAERA_TEST_GH_2102="$fixture_root/extracted/usr/bin/gh" \
            cargo test --locked -p chimaera-server --lib --features provider-github-fixture \
            pinned_gh_2102_ignores_project_endpoint_config_through_unlinked_directory -- --ignored
      - run: cargo test --manifest-path plugins/Cargo.toml

  musl:
    needs: ui
    runs-on: ubuntu-latest
    # This gate proves the static cross-build compiles and links; the binaries
    # users get are built by release.yml. So it skips the `release` profile's
    # fat LTO and single codegen unit, whose whole-program link dominates the
    # build. Job-level on purpose: rust-cache hashes CARGO* env into its key.
    # Set on the build step alone, the key would stay the LTO build's, and
    # restore dependencies built as LTO bitcode this build cannot reuse.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-ui-dist
          path: web-ui/dist
      # rust-toolchain.toml pins the channel and both musl targets.
      - run: rustup show
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # One cache per target. rust-cache keys on the job name, not the
          # matrix, so without this both legs share one entry: whichever
          # saves first wins, and the other leg restores it and recompiles
          # its whole target dependency tree (wasmtime, cranelift, tokio).
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-zigbuild --locked --version 0.23.0
      - run: cargo zigbuild --release --target ${{ matrix.target }} -p chimaera
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chimaera-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/chimaera
      # Capture the default binary first: this optional build replaces the
      # local output path, but never the default artifact or release inputs.
      - name: Build explicit personal-provider ARM fixture daemon
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --locked --release --target ${{ matrix.target }} -p chimaera --features provider-github-fixture,provider-claude-fixture
      - name: Upload explicit personal-provider ARM fixture daemon
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chimaera-provider-authority-prototype-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/chimaera
          if-no-files-found: error
      # Cross-compile the ignored contained CLI probes without executing them.
      # The disposable ARM VM runs these against fixed local synthetic peers.
      - name: Build explicit provider ARM test artifact
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          bash scripts/build-plugins.sh
          cargo-zigbuild test --locked --release --target aarch64-unknown-linux-musl \
            -p chimaera-server --lib --features provider-github-fixture,provider-claude-fixture --no-run \
            --message-format=json > "$RUNNER_TEMP/provider-test-build.jsonl"
          python3 - <<'PYARTIFACT'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          selected = []
          with open(pathlib.Path(os.environ["RUNNER_TEMP"]) / "provider-test-build.jsonl") as records:
              for line in records:
                  item = json.loads(line)
                  if (item.get("reason") == "compiler-artifact"
                          and item.get("target", {}).get("name") == "chimaera_server"
                          and "lib" in item["target"]["kind"]
                          and item.get("profile", {}).get("test") is True
                          and item.get("executable")):
                      selected.append(pathlib.Path(item["executable"]).resolve(strict=True))
          assert len(selected) == 1, "exact provider lib-test artifact required"
          source = selected[0]
          assert source.is_relative_to(root / "target/aarch64-unknown-linux-musl/release")
          assert source.is_file() and source.stat().st_size <= 536870912
          output = root / "target/provider-arm-tests"
          output.mkdir()
          binary = output / "chimaera-server-tests"
          shutil.copyfile(source, binary)
          binary.chmod(0o755)
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          (output / "fixture-sha256.txt").write_text(digest + "  chimaera-server-tests\n")
          (output / "fixture-revision.txt").write_text(subprocess.check_output(["git", "rev-parse", "HEAD"], text=True))
          PYARTIFACT
      - name: Upload explicit provider ARM test artifact
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chimaera-provider-tests-aarch64-unknown-linux-musl
          path: target/provider-arm-tests/
          if-no-files-found: error
          retention-days: 7
