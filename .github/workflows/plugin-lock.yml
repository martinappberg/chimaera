name: plugin-lock

# Keeps plugins/plugins.lock on each first-party plugin's latest release, so
# a plugin release reaches the app with no hand-made pull request: a newer,
# checked release (.github/scripts/plugin-lock.mjs) becomes a `fix:` PR, CI
# installs it against the new lock, and the merge requests a patch release
# (the next daily batch ships it, docs/agent-guides/releases.md). The
# lock is written with each release's own tier and caps, read by the
# daemon's own code: when a newer release exists, the chimaera CLI is built
# from this checkout and `chimaera plugin caps --against` reads both
# manifests. The PR auto-merges (squash) only when, for every bumped plugin,
# the pinned release reads as the lock records, the two plugin.tomls are
# identical except for words, and a privileged one's plugin.wasm and
# plugin.toml are in one attestation from the plugin repository's release
# workflow, at the release's tag or on main, from the commit the tag points
# to, which is on main (the tag and main checked through the API, then
# `gh attestation verify`, preinstalled on the runner, with this run's token; attestations of
# public repositories need no extra permission). A sandboxed plugin needs no
# attestation: the sandbox bounds it. An attestation proves the files were
# built by the plugin repository's release workflow from a commit on its
# main; it does not prove anyone reviewed that commit, so whoever can merge
# to a privileged plugin's main and release it ships without a second look
# here (the maintainer's chosen trade). Anything else waits for a person
# (docs/design/plugin-platform-plan.md §2), with a body that says which
# condition failed, whether provenance verified, whether the tier changed and
# which Can lines the release adds and drops, with the compare link. CI then
# checks only that the lock matches the release: that is not an approval, so
# a green PR that waits for review still needs a person to read the code.
# Hourly, on demand, and on a `plugin-released` dispatch
# (a plugin repository may send one after publishing; the schedule covers
# it otherwise).
#
# Writes use the PLUGIN_LOCK_TOKEN secret, not GITHUB_TOKEN: a branch pushed
# and a PR opened with GITHUB_TOKEN trigger no workflows, so ci.yml and the
# cla status would never report and auto-merge would never fire, and a merge
# it made would not start ci.yml's main run, which a release waits on.
# Without the secret a bump is only reported (a warning), never opened.
# Three jobs: `gate` (is a bump PR open; is anything newer), `build` (only
# when something is: the chimaera CLI from this checkout, with no secret and
# read-only contents, no cache) and `decide`. The secret is in the
# environment of exactly two steps, the ones that close or update an open
# bump and that push and open a new one; no build step ever sees it.
# Setup: plugins/AGENTS.md.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-released]

# The least by default; each job names what it needs.
permissions:
  contents: read

# One bump at a time; a queued run sees the PR the running one opened.
concurrency:
  group: plugin-lock
  cancel-in-progress: false

jobs:
  # Whether there is anything to do. Most hourly runs stop here.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
    outputs:
      open: ${{ steps.open.outputs.open }}
      newer: ${{ steps.newer.outputs.newer }}
      newer_failed: ${{ steps.newer.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # An open bump lands first; newer releases wait for the next run. Should
      # `main` require up-to-date branches again, a bump that fell behind would
      # never auto-merge, so bring it up to date (its checks rerun). One that
      # can't land any more — it conflicts with a lock edited on main, or main
      # already carries its change (an empty squash would cut an empty
      # release) — is closed and its branch deleted, and this run bumps
      # afresh from main's lock.
      - name: an open bump comes first
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          # Only this step (gh) sees it in this job.
          LOCK_TOKEN: ${{ secrets.PLUGIN_LOCK_TOKEN }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("plugin-lock/"))][0].number // empty')"
          if [ -n "$pr" ]; then
            state="$(gh pr view "$pr" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)"
            changed="$(gh api "repos/$REPO/pulls/$pr" --jq .changed_files)"
            echo "plugin-lock PR #$pr is open ($state, $changed file(s) changed)"
            if [ -n "$LOCK_TOKEN" ] && { [ "$state" = DIRTY ] || [ "$changed" = 0 ]; }; then
              GH_TOKEN="$LOCK_TOKEN" gh pr close "$pr" --repo "$REPO" --delete-branch \
                --comment "Superseded: this bump no longer applies to main (it conflicts, or main already has it). The plugin-lock workflow bumps afresh from main's lock."
              echo "closed #$pr; bumping from main"
              pr=""
            elif [ "$state" = BEHIND ] && [ -n "$LOCK_TOKEN" ]; then
              GH_TOKEN="$LOCK_TOKEN" gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" --silent
              echo "brought #$pr up to date with main; newer releases wait until it lands"
            else
              echo "newer releases wait until it lands"
            fi
          fi
          echo "open=$pr" >> "$GITHUB_OUTPUT"

      # Cheap: only whether any plugin has a newer release (API calls).
      - name: anything newer?
        id: newer
        if: steps.open.outputs.open == ''
        # A repository whose latest release can't be read must not hold back
        # the others; the deciding job fails the run.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/plugin-lock.mjs --newer

  # The manifests are read by the daemon's own code: the chimaera CLI built
  # from this checkout (never a downloaded release binary — an older one
  # could ignore a key the current daemon reads, which would fail open).
  # This job runs the build (npm, Vite, build.rs, proc-macros) with no
  # secret and read-only contents, and hands the binary over as an artifact
  # whose sha256 the deciding job checks. No cache: a restored target/ could
  # carry a prebuilt binary with forged fingerprints that cargo would reuse,
  # so every build is cold (a few times a month). The npm cache setup-node
  # keeps is only downloaded tarballs, which `npm ci` checks against the
  # sha512 integrity in package-lock.json, so it can't change what is built;
  # crates are fetched fresh and checked against Cargo.lock's checksums.
  build:
    needs: gate
    if: needs.gate.outputs.newer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.binary.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      # The daemon embeds web-ui/dist (rust-embed needs it at compile time).
      # No dependency's install scripts run (--ignore-scripts); the UI builds
      # without them.
      - name: build the web UI the daemon embeds
        working-directory: web-ui
        run: npm ci --ignore-scripts && npm run build
      - name: toolchain (rust-toolchain.toml)
        run: rustup show
      - name: build the chimaera CLI from this checkout (cold, its own target dir)
        id: binary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          cargo build --locked -p chimaera
          mkdir -p "$RUNNER_TEMP/cli"
          cp "$CARGO_TARGET_DIR/debug/chimaera" "$RUNNER_TEMP/cli/chimaera"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/cli/chimaera" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chimaera-cli
          path: ${{ runner.temp }}/cli/chimaera
          if-no-files-found: error
          retention-days: 1

  # Decides and, with the token on the one step that writes, opens the PR.
  decide:
    needs: [gate, build]
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.gate.outputs.newer == 'true' && needs.build.result == 'success'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.gate.outputs.newer == 'true' && needs.build.result == 'success'
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gate.outputs.newer == 'true' && needs.build.result == 'success'
        with:
          name: chimaera-cli
          path: ${{ runner.temp }}/cli
      - name: the binary is the one the build job made
        if: needs.gate.outputs.newer == 'true' && needs.build.result == 'success'
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$WANT" "$RUNNER_TEMP/cli/chimaera" | sha256sum --strict -c
          chmod +x "$RUNNER_TEMP/cli/chimaera"

      - name: check the latest releases
        id: bump
        if: needs.gate.outputs.newer == 'true' && needs.build.result == 'success'
        # A release that fails a check must not hold back the others: the
        # PR still opens for those, and the last step fails the run.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/plugin-lock.mjs --chimaera "$RUNNER_TEMP/cli/chimaera" --write --out "$RUNNER_TEMP/plugin-lock"

      - name: open the pull request
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE: ${{ steps.bump.outputs.automerge }}
          # The only step in this job that sees it: it pushes the branch and
          # opens the PR, after the decision is made.
          LOCK_TOKEN: ${{ secrets.PLUGIN_LOCK_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/plugin-lock"
          title="$(cat "$dir/title")"
          branch="$(cat "$dir/branch")"
          # A bump PR someone closed unmerged turned that version down: never
          # reopen it. (The workflow's own closes above delete the branch and
          # say so; a branch left by a run that failed before its PR is
          # simply overwritten below.)
          declined="$(gh pr list --repo "$REPO" --state closed --head "$branch" --limit 20 \
            --json number,mergedAt,comments \
            --jq '[.[] | select(.mergedAt == null) | select(all(.comments[]; (.body | startswith("Superseded:")) | not))] | length')"
          if [ "$declined" != 0 ]; then
            echo "::notice title=plugin-lock::a PR for $branch was closed unmerged; that version was turned down, not reopening it"
            exit 0
          fi
          git diff -- plugins/plugins.lock
          if [ -z "$LOCK_TOKEN" ]; then
            echo "::warning title=plugin-lock::'$title' is ready, but the PLUGIN_LOCK_TOKEN secret isn't set, so no pull request was opened (setup: plugins/AGENTS.md)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "$title" -- plugins/plugins.lock
          # --force: the branch is the workflow's own, left (if at all) by a
          # run that failed before its PR opened.
          git push -q --force "https://x-access-token:${LOCK_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${branch}"
          export GH_TOKEN="$LOCK_TOKEN"
          gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file "$dir/body.md"
          if [ "$AUTOMERGE" = true ]; then
            gh pr merge "$branch" --repo "$REPO" --auto --squash
          else
            echo "::notice title=plugin-lock::'$title' needs a maintainer's review (a capability or manifest change, or a privileged release without a verified attestation; the PR body says which): no auto-merge"
          fi

      - name: a release failed its checks
        if: needs.gate.outputs.newer_failed == 'true' || steps.bump.outcome == 'failure' || (needs.gate.outputs.newer == 'true' && needs.build.result != 'success')
        env:
          BUILD: ${{ needs.build.result }}
        run: |
          echo "::error title=plugin-lock::a plugin release failed its checks, or the chimaera CLI didn't build (build: $BUILD); the lock keeps the version it had"
          exit 1
