name: release

# Releases are BATCHED, not cut per merge: one scheduled run a day, plus a manual
# run (`gh workflow run release.yml`) to ship now. Every user's app auto-updates
# to each release, so a release per merge meant several updates a day.
#
# NOT every run cuts a release. scripts/version-bump.sh decides from the squash
# SUBJECTS of every merge since the last v-tag (Conventional Commits): feat ->
# minor, fix|perf|revert -> patch, `!` -> major, and
# refactor|chore|docs|test|ci|build|style (and [skip release]) -> NO release; the
# largest bump wins. Subject-anchored on purpose, so a folded PR body can't flip
# the bump or skip a release. Full policy + rationale: docs/agent-guides/releases.md (the single
# source); the bump logic is characterization-tested by scripts/version-bump.test.sh
# in ci.yml. A single workflow does version + build + publish: a tag pushed by
# GITHUB_TOKEN cannot trigger a second workflow, so the release cannot be split.
#
# Releases are PUBLISHED (not draft) so the installed app auto-updates. The
# safety gate is main's own CI: a run releases the newest main commit whose
# ci.yml push run succeeded, never main's tip blindly, since a PR's checks ran
# on its branch and not necessarily on the tree its merge produced.
# App update signing needs TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]
# repo secrets (see .github/CONTRIBUTING.md); auto-update only resolves once the repo
# (or its releases) is public.
on:
  schedule:
    # 16:41 UTC: morning in the maintainer's time zone, so a bad release
    # meets someone awake. An odd minute dodges the top-of-hour cron rush.
    - cron: "41 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, the next waiting. Per ref: a run dispatched from
# another branch ships nothing (see `version`), yet in a shared group it would
# replace a main run waiting there.
concurrency: release-${{ github.ref }}

# Match CI's temporary Ubuntu 24 baseline for the jobs previously on latest.
# Exit criteria: docs/agent-guides/releases.md#linux-runner-migration.
jobs:
  version:
    # A run dispatched from another branch would use that branch's copy of
    # this file; only main's ships.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    # No job-level skip gate: the script owns the decision (incl. [skip release]
    # and the no-release types) and emits `release=false`; downstream build/publish
    # jobs are gated on `needs.version.outputs.release == 'true'`.
    outputs:
      release: ${{ steps.bump.outputs.release }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.green.outputs.sha }}
    steps:
      # The newest main commit ci.yml passed on. Main's tip may still be
      # under test, or red; releasing the last green commit holds back only
      # what came after it, and the next run picks that up once it passes.
      - id: green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TIP: ${{ github.sha }}
        run: |
          sha=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ]; then
            echo "::error title=release::no successful ci.yml run on main to release from"
            exit 1
          fi
          if [ "$sha" != "$TIP" ]; then
            echo "::notice title=release::releasing from ${sha:0:8}, the newest main commit ci.yml passed on, not this run's ${TIP:0:8}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.green.outputs.sha }}
          fetch-depth: 0
      - id: bump
        run: |
          # This run's steps are release.yml as of $GITHUB_SHA; the tree it
          # builds is the green commit's. Where that file differs, a step can
          # miss what the tree needs (a version-stamp sed that no-ops ships a
          # 0.0.1 app) or run what it lacks. A later run, once they agree,
          # ships this batch.
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- .github/workflows/release.yml; then
            echo "::warning title=release::release.yml at ${GITHUB_SHA:0:8} (this run's steps) differs from the release commit's; not releasing until main's tip passes ci.yml"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          # Every merge since the last release: that is the batch this run
          # ships. To finish a release that failed partway, re-run its failed
          # jobs (they keep this job's outputs); re-running this job reads
          # afresh, and skips unless more merges have gone green since.
          if [ -n "$latest" ]; then range="$latest..HEAD"; else range=HEAD; fi
          mapfile -t subjects < <(git log --first-parent --format=%s "$range")
          echo "merges since ${latest:-the start}:"
          printf '  %s\n' "${subjects[@]}"
          result=$(bash scripts/version-bump.sh "$latest" "${subjects[@]}")
          if [ "$result" = "skip" ]; then
            echo "no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$result"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$result" >> "$GITHUB_OUTPUT"
          fi

  # Build once at the selected green commit; every Unix binary embeds these assets.
  ui:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm ci
        working-directory: web-ui
      - run: npm run build
        working-directory: web-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist

  daemon:
    needs: [version, ui]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist
      - run: rustup show
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # Keep aligned with ci.yml so runner validation changes only the OS.
          version: 0.17.0
          cache-key: ubuntu-24.04-${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ubuntu-24.04-${{ matrix.target }}-zig-0.17.0
      - run: cargo install cargo-zigbuild --locked --version 0.23.4
      # Stamp the release version so the daemon reports it (health / manifest).
      - run: sed -i "s/^version = \"0.0.1\"/version = \"${{ needs.version.outputs.version }}\"/" Cargo.toml
      - run: cargo zigbuild --release --target ${{ matrix.target }} -p chimaera
      - run: cp target/${{ matrix.target }}/release/chimaera chimaera-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chimaera-${{ matrix.target }}
          path: chimaera-${{ matrix.target }}

  daemon-macos:
    needs: [version, ui]
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sed -i "" "s/^version = \"0.0.1\"/version = \"${{ needs.version.outputs.version }}\"/" Cargo.toml
      - run: cargo build --release -p chimaera
      - run: cp target/release/chimaera chimaera-aarch64-apple-darwin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chimaera-aarch64-apple-darwin
          path: chimaera-aarch64-apple-darwin

  # Build + sign the app and CREATE + PUBLISH the release (tauri-action owns
  # it, and emits latest.json because the app config sets createUpdaterArtifacts).
  app:
    needs: [version, ui]
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # The shared UI build already produced the assets Rust embeds.
      APP_BUILD_CONFIG: '{"build":{"beforeBuildCommand":""}}'
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: Lieberose Consulting AB (8PPK8S7967)'
      APPLE_TEAM_ID: '8PPK8S7967'
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Prepare Apple release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE secret (base64 .p12)}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD secret}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER secret}"
          : "${APPLE_API_KEY:?Missing APPLE_API_KEY secret}"
          : "${APPLE_API_PRIVATE_KEY:?Missing APPLE_API_PRIVATE_KEY secret (.p8 contents)}"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/chimaera-notary.p8"
          umask 077
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          printf 'APPLE_API_KEY_PATH=%s\n' "$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
          xcrun notarytool history --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" >/dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/chimaera-app/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui-dist
          path: web-ui/dist
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/chimaera-app
          # A no-op today (rust-cache's default key is the job name, `app`), but
          # pinned so a future rename of this job cannot silently stop app.yml's
          # PR build from restoring this cache. This job runs only on main, so
          # it is the writer; rust-cache's default `save-if: true` is correct.
          shared-key: app
      - run: npm ci
        working-directory: crates/chimaera-app
      # The app version drives both the bundle and the updater comparison.
      # The root workspace version is stamped too so chimaera-core::VERSION —
      # which the app reads to auto-fetch the matching remote daemon from this
      # release — reports the release version, not the "0.0.1" dev sentinel.
      - run: |
          sed -i "" "s/\"version\": \"0.0.1\"/\"version\": \"${{ needs.version.outputs.version }}\"/" crates/chimaera-app/tauri.conf.json
          sed -i "" "s/^version = \"0.0.1\"/version = \"${{ needs.version.outputs.version }}\"/" crates/chimaera-app/Cargo.toml
          sed -i "" "s/^version = \"0.0.1\"/version = \"${{ needs.version.outputs.version }}\"/" Cargo.toml
      - name: Prepare plugin smoke assets
        run: bash scripts/build-plugins.sh
      # The custom build command verifies the app, then notarizes/staples the
      # DMG and checks its Gatekeeper acceptance before the action uploads.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/chimaera-app
          tauriScript: bash ../../scripts/build-macos-release.sh
          args: --config '${{ env.APP_BUILD_CONFIG }}'
          tagName: v${{ needs.version.outputs.version }}
          releaseCommitish: ${{ needs.version.outputs.sha }}
          releaseName: "chimaera v${{ needs.version.outputs.version }}"
          releaseDraft: false
          uploadUpdaterJson: true
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/chimaera-notary.p8"

  # Linux + Windows app bundles join the SAME release, as ONE matrix so the
  # recipe cannot drift per-OS. Deliberately serialized (app -> linux ->
  # windows via max-parallel): every tauri-action run does a read-modify-write
  # on the shared latest.json updater manifest, and concurrent jobs have a
  # documented race (tauri-action #409/#927/#1270) that silently ships a
  # latest.json missing a platform — which breaks that platform's auto-update
  # invisibly. Slower, always correct.
  app-bundles:
    needs: [version, app]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # GNU sed + one quoting dialect everywhere (Git-for-Windows bash).
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: crates/chimaera-app/package-lock.json
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Linux'
        with:
          name: web-ui-dist
          path: web-ui/dist
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/chimaera-app
          # Writer for the per-OS app caches app.yml's bundle matrix restores
          # (rust-cache keys include the OS; same pairing as the macOS `app`
          # job above).
          shared-key: app
      - run: npm ci
        working-directory: crates/chimaera-app
      # Same three stamps as the macOS app job (GNU sed, no BSD -i "").
      - run: |
          sed -i "s/\"version\": \"0.0.1\"/\"version\": \"${{ needs.version.outputs.version }}\"/" crates/chimaera-app/tauri.conf.json
          sed -i "s/^version = \"0.0.1\"/version = \"${{ needs.version.outputs.version }}\"/" crates/chimaera-app/Cargo.toml
          sed -i "s/^version = \"0.0.1\"/version = \"${{ needs.version.outputs.version }}\"/" Cargo.toml
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/chimaera-app
          # Linux embeds the shared UI artifact; Windows has no embedded daemon.
          args: --config '{"build":{"beforeBuildCommand":""}}'
          tagName: v${{ needs.version.outputs.version }}
          releaseCommitish: ${{ needs.version.outputs.sha }}
          releaseName: "chimaera v${{ needs.version.outputs.version }}"
          releaseDraft: false
          uploadUpdaterJson: true

  # Attach the daemon binaries to the release tauri-action published.
  attach-daemons:
    needs: [version, app, daemon, daemon-macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: chimaera-*
          merge-multiple: true
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" \
            artifacts/chimaera-x86_64-unknown-linux-musl \
            artifacts/chimaera-aarch64-unknown-linux-musl \
            artifacts/chimaera-aarch64-apple-darwin \
            --repo "${{ github.repository }}" --clobber

  # A plugin release plugins.lock pins may be a pre-release: a manifest only
  # this chimaera reads, hidden from released daemons and the lock bot until
  # now. With this release out, each becomes a full release (and its
  # repository's latest). Edits other repositories, so it writes with
  # PLUGIN_LOCK_TOKEN, not GITHUB_TOKEN (plugins/AGENTS.md).
  plugin-pins:
    needs: [version, attach-daemons]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - env:
          PLUGIN_TOKEN: ${{ secrets.PLUGIN_LOCK_TOKEN }}
        run: node .github/scripts/plugin-pins.mjs --write
