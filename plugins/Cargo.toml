# The daemon's test fixture plugins: its own cargo workspace, never the
# daemon's. A plugin crate is a cdylib that only links for wasm32-wasip2 (its
# component export names do not link natively on macOS), so it is built by
# scripts/build-plugins.sh and checked/unit-tested natively from here:
#   cargo clippy --manifest-path plugins/Cargo.toml --all-targets -- -D warnings
#   cargo test --manifest-path plugins/Cargo.toml
# The first-party plugins live in their own repositories; plugins.lock pins
# the releases the daemon embeds.
[workspace]
resolver = "2"
members = ["api-0.1", "test-fixture", "test-platform", "test-privileged"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/martinappberg/chimaera"
publish = false

[workspace.dependencies]
chimaera-plugin-api = { path = "../crates/chimaera-plugin-api" }
# The frozen 0.1 API (api-0.1/), renamed so 0.1 code reads the same.
chimaera-plugin-api-v0-1 = { path = "api-0.1" }

# A small component, like a released plugin's.
[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
