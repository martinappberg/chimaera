# The first-party plugins this repository ships inside the chimaera binary.
# Each lives in its own repository and publishes a release per version
# (tag v<version>: plugin.wasm, plugin.toml, SHA256SUMS). For every
# [[plugin]] here, scripts/build-plugins.sh downloads
#   https://github.com/<repo>/releases/download/v<version>/{plugin.wasm,plugin.toml}
# verifies both against the sha256s below (the release's SHA256SUMS), checks
# that the manifest's version is this one, and lays them out in
# plugins/dist/<id>/, which the daemon embeds: it ships exactly these bytes.
#
# A first-party bump is a reviewed change to this file: the new version and
# the two sha256s from that release's SHA256SUMS, nothing else. To develop a
# plugin against the daemon without a release, see plugins.local.toml in
# plugins/AGENTS.md.

[[plugin]]
id = "agent-notes"
version = "0.1.0"
repo = "martinappberg/chimaera-plugin-agent-notes"
sha256_wasm = "fd75d0ef0ba2581c5c39f74a8ef6e5547c4f78ae4c0c85c804e554f8708cca1d"
sha256_toml = "897b0cbbd29b4a7da6b06a2b82938b03b536ccc634408ede88e1d69c61665550"

