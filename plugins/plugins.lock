# The first-party plugins: the curated list chimaera embeds (the daemon
# carries no plugin bytes). Each lives in its own repository and publishes a
# release per version (tag v<version>: plugin.wasm, plugin.toml, SHA256SUMS).
# For every [[plugin]] here the Extensions tab lists the plugin (`name`,
# `summary`) with an Install button, and Install (or
# `chimaera plugin add <id>`) fetches
#   https://github.com/<repo>/releases/download/v<version>/{SHA256SUMS,plugin.toml,plugin.wasm}
# into ~/.chimaera/plugins/<id>/<version>/, refusing any file whose sha256
# is not the one below (the release's SHA256SUMS) — so the card can say the
# copy is exactly the release chimaera pins. scripts/build-plugins.sh
# downloads the same releases into plugins/dist-test for the daemon's tests.
#
# A first-party bump is automatic: .github/workflows/plugin-lock.yml checks
# each repository's latest release hourly (SHA256SUMS against the downloaded
# bytes; the manifest's id, version and [release] github against this file),
# rewrites the entry — version, the two sha256s, and `name` / `summary` from
# the release's plugin.toml — and opens a `fix:` PR, which CI (these same
# releases, downloaded and installed) gates. `tier` and `caps` are what the
# maintainers approved the plugin to do (`chimaera plugin caps plugin.toml`
# prints both): a sandboxed plugin keeps its badge on an update only while
# its capability digest is this one, and a privileged plugin (one that runs
# or downloads programs) is verified only at the pinned version. So the PR
# auto-merges only when the release is sandboxed and asks for nothing new;
# anything else waits for a person, who updates tier and caps. Hand edits
# follow the same rules; keep every value a one-line "string". To run a
# local build of a plugin against the daemon: `chimaera plugin add --path
# <dir>` (see plugins/AGENTS.md).
#
# A plugin whose job moved into chimaera itself leaves this list for the
# daemon's RETIRED list (crates/chimaera-server/src/plugins/retired.rs):
# an installed copy is listed, off, with Remove, and no install takes it.

