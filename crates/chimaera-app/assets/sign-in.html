<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · chimaera</title>
<style>
:root{color-scheme:light dark;--bg:#fbfbfc;--fg:#1d1d20;--muted:#65656d;--edge:#e3e3e7;--accent:#2e9e6b;--mark-start:#2c2c30;--mark-end:#9c9ca4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#17171c;--fg:#e7e7ea;--muted:#9a9aa6;--edge:#31313b;--accent:#3fbf85;--mark-start:#e7e7ea;--mark-end:#747480}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);display:grid;place-items:center;padding:32px 24px}main{max-width:440px;width:100%}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;letter-spacing:.01em;margin-bottom:44px}.brand svg{width:38px;height:38px}h1{font-size:clamp(26px,6vw,34px);font-weight:600;line-height:1.15;letter-spacing:-.035em;margin:0 0 16px}p{font-size:15px;line-height:1.65;color:var(--muted);margin:0}footer{border-top:1px solid var(--edge);margin-top:32px;padding-top:18px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px}
</style>
<main>
  <div class="brand"><svg viewBox="0 0 240 240" aria-hidden="true"><defs><linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--mark-start)"/><stop offset="1" stop-color="var(--mark-end)"/></linearGradient></defs><g fill="none" stroke="url(#mark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M120 46 L186 84 L186 156 L120 194 L54 156 L54 84 Z"/><path d="M151.4 154.9 A 47 47 0 1 1 151.4 85.1"/></g></svg><span>chimaera</span></div>
  <h1>{{title}}</h1><p>{{message}}</p>
  <footer><span class="dot"></span>Secure desktop sign-in</footer>
</main>
</html>
