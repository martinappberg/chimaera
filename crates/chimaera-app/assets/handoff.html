<!doctype html>
<!-- Shown while quitting hands working agents to the cloud (shell/quit.rs).
     Shell-local: the project names arrive in window.__CHIMAERA_HANDOFF__
     (an initialization script), a failure through chimaeraHandoffFailed()
     (evaluated by the shell). Its only bridge call is closing itself
     (capabilities/cloud-handoff.json); the shell turns that close into the
     quit. Names are set as text, never as markup. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Continue in the cloud</title>
    <style>
      :root {
        --bg: #0e1116;
        --text: #e7ebf0;
        --muted: #8b95a3;
        --line: #232c37;
        --chip: #141a22;
        --accent: #4ade80;
        --on-accent: #0e1116;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7f9;
          --text: #1a2129;
          --muted: #5d6b7b;
          --line: #dde3ea;
          --chip: #ffffff;
          --accent: #16a34a;
          --on-accent: #ffffff;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        display: flex;
        flex-direction: column;
        padding: 22px 24px 20px;
        gap: 12px;
      }
      .brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
      .brand svg { width: 16px; height: 16px; color: var(--accent); }
      h1 { font-size: 16px; font-weight: 600; }
      .detail { color: var(--muted); }
      .detail[hidden] { display: none; }
      ul {
        list-style: none; padding: 0;
        display: flex; flex-wrap: wrap; gap: 6px;
        max-height: 76px; overflow: auto;
      }
      li {
        background: var(--chip); border: 1px solid var(--line);
        border-radius: 6px; padding: 2px 8px; font-size: 13px;
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; min-height: 34px; }
      .progress { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
      .progress[hidden] { display: none; }
      .spinner {
        flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%;
        border: 2px solid var(--line); border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
      button {
        margin-left: auto;
        font: 600 13px system-ui, "Segoe UI", sans-serif;
        color: var(--on-accent); background: var(--accent);
        border: none; border-radius: 8px; padding: 7px 18px; cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="brand">
      <!-- The hexmark, the same brand mark the site and app use. -->
      <svg viewBox="0 0 240 240" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M120 46 L186 84 L186 156 L120 194 L54 156 L54 84 Z" />
        <path d="M151.4 154.9 A 47 47 0 1 1 151.4 85.1" />
      </svg>
      <span>chimaera</span>
    </div>
    <h1 id="heading" aria-live="polite">Sending your work to the cloud…</h1>
    <p class="detail" id="detail" hidden></p>
    <ul id="projects" aria-label="Projects"></ul>
    <div class="foot">
      <span class="progress" id="progress"><span class="spinner"></span><span>Chimaera quits when this is done.</span></span>
      <button id="quit" type="button" hidden>Quit</button>
    </div>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const data = window.__CHIMAERA_HANDOFF__ || { projects: [] };
      for (const name of (data.projects || []).slice(0, 64)) {
        const item = document.createElement("li");
        item.textContent = String(name);
        item.title = String(name);
        $("projects").appendChild(item);
      }
      // The shell turns this window's close into the quit.
      function quit() {
        const bridge = window.__TAURI__ && window.__TAURI__.window;
        if (bridge) bridge.getCurrentWindow().close();
      }
      $("quit").addEventListener("click", quit);
      window.chimaeraHandoffFailed = (heading, detail) => {
        $("heading").textContent = String(heading);
        $("detail").textContent = String(detail);
        $("detail").hidden = false;
        $("progress").hidden = true;
        $("quit").hidden = false;
        $("quit").focus();
      };
    </script>
  </body>
</html>
