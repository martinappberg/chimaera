[package]
name = "chimaera-app"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/martinappberg/chimaera"

# Deliberately a standalone workspace: the Tauri/webview stack must never
# enter the daemon workspace (musl CI, HPC login-node builds stay lean).
[workspace]

# The shipped binary is just "chimaera" (matches productName) so the dock,
# menu bar, and `ps` read the brand — not "chimaera-app".
[[bin]]
name = "chimaera"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `tray-icon`: the macOS menu-bar / Windows-Linux system-tray status item
# (tray.rs). On Linux this pulls libayatana-appindicator into the bundle — a
# packaging dependency, accepted deliberately for the tray affordance.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# The shell owns process-global resources (window persistence, ssh tunnels,
# askpass), so a second process must hand off to the first instead of racing
# independent copies of that state.
tauri-plugin-single-instance = "2"
# Self-update: check GitHub releases, verify against the embedded minisign
# pubkey, download+swap the bundle. All updater ops run in Rust (the web
# UI only calls our check/install commands); relaunch uses core restart().
tauri-plugin-updater = "2"
# OS clipboard backend for the `write_clipboard` command: WKWebView rejects a
# non-gesture navigator.clipboard.writeText (agent OSC 52 / copy-on-select), so
# those writes run in the Rust process instead, where there is no gesture gate.
tauri-plugin-clipboard-manager = "2"
# Files on the OS clipboard (`copy_file_to_clipboard`): the plugin above only
# exposes text/image/html, so the file list goes through the same arboard it
# already links. No default features: nothing here needs its image codecs.
arboard = { version = "3.6", default-features = false }
# Hand external web URLs to the user's real browser (`open_external`): the
# shell's navigation guard admits only the daemon origin, so a rendered link
# has nowhere else to go. Same crate the CLI uses to open the UI.
open = "5"
ureq = { version = "3", features = ["json"] }
# The "open in PowerPoint" round trip's content hashes (the daemon's
# `X-Content-Hash`/`expect_hash` are SHA-256); already in the tree through
# chimaera-remote, same version.
sha2 = "0.11"
urlencoding = "2"

chimaera-core = { path = "../chimaera-core" }
chimaera-remote = { path = "../chimaera-remote" }

# Unix-only: `--daemon` embeds the server (the .app is self-contained), and
# nix delivers the graceful SIGTERM in stop_local. On Windows neither exists —
# the daemon is the Linux musl binary inside WSL2, so the whole server stack
# (and its PTY/unix surface) must stay out of that build.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }
chimaera-server = { path = "../chimaera-server" }

# macOS notifications: UNUserNotificationCenter (the modern API — click
# responses, foreground presentation, per-workspace grouping, removal of
# stale alerts) plus the Dock tile badge/bounce, which must work with zero
# windows open. Same objc2 generation tao/wry already link, so no new
# framework stack enters the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSError", "NSBundle", "NSObject", "NSDictionary", "NSData", "NSGeometry", "NSURL", "NSURLRequest", "NSValue", "NSProcessInfo", "NSDate"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSDockTile", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSEvent", "NSGraphicsContext", "NSWindow", "NSTrackingArea", "NSScreen", "objc2-core-graphics"] }
# Pane views (`shell/native_view/mac.rs`): a WKWebView the shell owns, its
# delegates, the bridge's content world, message handler and user script,
# snapshots and calls into the world. The same objc2-web-kit wry links.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKUserScript", "WKContentWorld", "WKScriptMessage", "WKScriptMessageHandler", "WKSnapshotConfiguration", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKUIDelegate", "WKWindowFeatures", "objc2-core-foundation"] }
# Agent driving (`native_view_drive`): a CGEvent pixel wheel turned into the
# NSEvent a view's `scrollWheel:` takes, and snapshots read back as CGImages.
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGImage", "CGWindow"] }
# Mission Control detection (`shell/mission_control.rs`): the window list it reads (a CFArray keyed by CFStrings).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString"] }
base64 = "0.22"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationSettings", "UNNotificationTrigger"] }

# Linux/Windows notifications (freedesktop D-Bus / WinRT toasts). macOS goes
# through UserNotifications above instead: this crate's macOS backend is the
# deprecated NSUserNotification API with no click routing.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18"

# Windows-only: registry-first WSL detection (never poke wsl.exe blind — the
# 24H2 stub can block 60s interactively when WSL is absent).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# The root workspace's dev profile (see the comment there): file:line debug
# info for our code, none for dependencies. Here the chimaera crates are path
# dependencies, not members, so "*" covers them and they are named back in.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.chimaera-agent]
debug = "line-tables-only"

[profile.dev.package.chimaera-core]
debug = "line-tables-only"

[profile.dev.package.chimaera-pty]
debug = "line-tables-only"

[profile.dev.package.chimaera-remote]
debug = "line-tables-only"

[profile.dev.package.chimaera-server]
debug = "line-tables-only"

[profile.release]
lto = true
strip = true
codegen-units = 1
