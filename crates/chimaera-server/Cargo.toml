[package]
name = "chimaera-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Consumers are explicit trusted-supervisor entrypoints, never normal startup.
provider-authority-prototype = ["dep:zeroize", "chimaera-core/provider-runtime"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
# The browser-pane reverse proxy (`proxy.rs`) drives hyper's HTTP/1.1 client
# half directly: per-request handshakes, streamed bodies, WS upgrades.
hyper.workspace = true
hyper-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
zeroize = { version = "1.9", optional = true, features = ["serde"] }
rust-embed.workspace = true
mime_guess.workspace = true
hostname.workspace = true
nix = { workspace = true, features = ["term", "signal"] }
rustix = { workspace = true, features = ["process"] }
chimaera-agent.workspace = true
chimaera-core.workspace = true
chimaera-pty.workspace = true
futures.workspace = true
bytes.workspace = true
# Content hashes for file versions (`X-Content-Hash`, PUT `expect_hash`), the
# stable `X-Mtime` token, and draft-mirror file names.
sha2.workspace = true
# Portable Git indexes retain Git's SHA-1 checksum where the repository uses it.
sha1 = "0.11"
comrak = { version = "0.54.0", default-features = false }
ammonia = "4.1.3"
csv = "1.4.0"
# Workbench plugin manifests (`plugin.toml`, embedded): parse + serde only —
# no editing, no serialization.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
# Plugin versions and `requires.chimaera` requirements (`plugins/`): the
# precedence rule, the release checker's "strictly newer", and the gates.
semver = "1"
# The plugin kill switch (`plugins/revoke.rs`): a fetched revocation list
# counts only with Ed25519 signatures from keys the binary embeds. Verify
# only: no key generation, no signing outside tests.
ed25519-dalek = { version = "3", default-features = false }
# The plugin host (`plugins/runtime.rs`): WASM components (the
# `chimaera:plugin` world) under epoch deadlines and memory caps. Pinned
# exactly: the embedding API changes between majors. Only what the host
# uses — the defaults pull in gc, threads, pooling, profiling, coredumps;
# `cache` (an on-disk code cache with a background worker) and
# `parallel-compilation` stay out on purpose.
wasmtime = { version = "=49.0.1", default-features = false, features = ["component-model", "async", "runtime", "std", "cranelift"] }
# WASI for the guest's std (wasi:io, wasi:cli), with nothing granted.
wasmtime-wasi = { version = "=49.0.1", default-features = false, features = ["p2"] }
# Spreadsheet previews (xlsx/xls/xlsm/ods) → the same paged TablePage the CSV
# viewer renders. calamine reads a whole sheet into memory, so the fs/xlsx
# handler caps both source size and ZIP expansion before parsing.
calamine = "0.36"
# Read only ZIP central-directory metadata to budget xlsx/xlsm/ods expansion
# before calamine materializes a workbook. Already present through calamine;
# this direct edge exposes the preflight API without adding another package.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Plugin tool downloads (`plugins/toolchain.rs`): tar archives read entry by
# entry — the extraction itself is ours (`O_NOFOLLOW`, relative to the
# folder's descriptor), never `tar::Archive::unpack` — and `.tar.xz`
# decoded in pure Rust (no C liblzma to cross-build for musl).
tar = { version = "0.4", default-features = false }
lzma-rs = "0.3"
# Gzip tier for fs/file + fs/table (.gz/.bgz previews). BGZF is standard
# multi-member gzip, which MultiGzDecoder decodes sequentially.
flate2 = "1.1"
# Folder downloads stream a zip: async_zip writes data-descriptor entries to
# any AsyncWrite (no Seek), so the archive flows through a bounded duplex
# pipe — never materialized in memory or on disk. Its read side also backs
# the tests, so no extra dev-dependency.
async_zip = { version = "0.0.18", default-features = false, features = ["tokio", "deflate"] }
# ReaderStream bridges plain files and the duplex's read half into an axum
# body stream (GET /download/{ticket}); compat adapts tokio files onto
# async_zip's futures-flavored entry writer.
tokio-util = { version = "0.7", features = ["io", "compat"] }
# `Last-Modified` on `/raw` (already in the tree through hyper).
httpdate = "1.0"
# UTC lease parsing is independent of the local wall-clock offset.
time = { version = "0.3", features = ["parsing"] }
# Decoding a sent chat image into its saved copy (already in the tree
# through axum).
base64 = "0.22"
# Loopback daemon forwarding shares axum's existing WebSocket codec (`connect`,
# no TLS), and voice dictation (`voice/`) makes the one outbound TLS WebSocket
# the daemon opens, to Claude's speech-to-text service: `curl` (the daemon's
# HTTPS transport everywhere else) cannot carry a two-way stream, so this takes
# a TLS stack: rustls on `ring` (no aws-lc — it needs cmake in the zigbuild musl
# jobs), trusting the host's own roots so a site CA works the way it does for curl.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

# macOS-only: foreground-process name/cwd for session display names
# (proc_pidinfo BSDINFO name / PIDVNODEPATHINFO cwd); Linux reads /proc.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
