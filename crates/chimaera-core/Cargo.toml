[package]
name = "chimaera-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Pure optional personal-control DTOs, not startup or capability enablement.
personal-providers = ["dep:url", "dep:zeroize"]
# Correlation/codec types only; activation still requires opaque controller authority.
provider-runtime = ["personal-providers"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand.workspace = true
dirs.workspace = true
hostname.workspace = true
url = { version = "2", optional = true }
zeroize = { version = "1", optional = true }

# Unix-only: uid/passwd lookups and the signal-0 liveness probe. The Windows
# build of the app workspace never touches processes by pid directly (the WSL
# shell probes liveness inside the distro), so core must compile without nix.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }
