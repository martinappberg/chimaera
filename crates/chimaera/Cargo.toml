[package]
name = "chimaera"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chimaera"
path = "src/main.rs"

[features]
# Explicit inherited-descriptor runtime consumers; ordinary startup stays unchanged.
provider-authority-prototype = ["chimaera-server/provider-authority-prototype"]
# Explicit reusable host continuation; private assembly owns fixed vendor flags.
provider-fixture-host = ["provider-authority-prototype", "chimaera-server/daemon-extension-fixture"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nix.workspace = true
open.workspace = true
mimalloc.workspace = true
chimaera-core.workspace = true
chimaera-remote.workspace = true
chimaera-server.workspace = true
