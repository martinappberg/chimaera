<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Replaced by the daemon at serve time. The Vite dev server leaves the
         sentinel in place, where the UI falls back to its first health read. -->
    <meta name="chimaera-build" content="__CHIMAERA_BUILD_ID__" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>chimaera</title>
    <!-- Paint a themed canvas before the module graph/CSS arrives. The
         settings store refreshes this origin-local cache whenever the daemon's
         persisted appearance changes, so a newly created native webview starts
         on the user's actual Chimaera palette instead of WebKit white. A
         first-ever origin falls back to the system light/dark preference. -->
    <style>
      :root {
        --chimaera-bootstrap-bg: #fbfbfc;
        background: var(--chimaera-bootstrap-bg);
      }
      :root[data-theme="dark"] {
        --chimaera-bootstrap-bg: #17171c;
      }
      body {
        background: var(--chimaera-bootstrap-bg);
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement;
        let mode =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        let background = mode === "dark" ? "#17171c" : "#fbfbfc";
        try {
          const cached = JSON.parse(
            localStorage.getItem("chimaera.appearanceBootstrap.v1") ?? "null",
          );
          if (
            (cached?.mode === "light" || cached?.mode === "dark") &&
            typeof cached.background === "string" &&
            CSS.supports("color", cached.background)
          ) {
            mode = cached.mode;
            background = cached.background;
          }
        } catch {
          // Storage can be unavailable; the system fallback above still holds.
        }
        root.dataset.theme = mode;
        root.style.colorScheme = mode;
        root.style.setProperty("--chimaera-bootstrap-bg", background);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
