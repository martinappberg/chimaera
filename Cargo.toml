[workspace]
resolver = "2"
members = [
    "crates/chimaera",
    "crates/chimaera-agent",
    "crates/chimaera-core",
    "crates/chimaera-plugin-api",
    "crates/chimaera-pty",
    "crates/chimaera-remote",
    "crates/chimaera-server",
    "crates/chimaera-wire-fixtures",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/martinappberg/chimaera"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
# The browser-pane reverse proxy's client half (both already in axum's own
# dependency graph — no new packages, just direct edges for the client API).
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http = { version = "0.7", features = ["trace"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
mime_guess = "2"
rand = "0.10"
dirs = "7"
sha2 = "0.11"
hostname = "0.4"
nix = { version = "0.31", features = ["signal", "process", "fs"] }
rustix = { version = "1", features = ["fs"] }
# Windows: job objects, process liveness and the other Win32 calls the
# daemon makes where Unix uses nix/rustix. The app workspace pins the same
# major (0.61).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
# Directory-confined file access that works on Windows too (the daemon's
# rustix dirfd code is Unix-only); already in the graph through wasmtime-wasi.
cap-std = "4"
cap-fs-ext = "4"
# Directory junctions: Windows' unprivileged stand-in for a directory symlink.
junction = "1"
# canonicalize without the Windows `\\?\` verbatim prefix (a no-op on Unix).
dunce = "1"
open = "5"
mimalloc = "0.1"

bytes = "1"
futures = "0.3"
portable-pty = "0.9"
alacritty_terminal = "0.26"

chimaera-agent = { path = "crates/chimaera-agent" }
chimaera-core = { path = "crates/chimaera-core" }
chimaera-plugin-api = { path = "crates/chimaera-plugin-api" }
chimaera-pty = { path = "crates/chimaera-pty" }
chimaera-remote = { path = "crates/chimaera-remote" }
chimaera-server = { path = "crates/chimaera-server" }
chimaera-wire-fixtures = { path = "crates/chimaera-wire-fixtures" }

# Dev builds keep file:line debug info for our own crates (panic backtraces,
# debugger breakpoints and stepping) but not variables, and none for
# dependencies. Full debug info made each worktree's target/ ~1.6x bigger, and
# on macOS every incremental rebuild strands ~3x more object data in
# target/debug/deps (the worktree-lifecycle skill). To inspect locals in a
# debugger, rebuild with CARGO_PROFILE_DEV_DEBUG=full. The release profile is
# untouched. crates/chimaera-app (its own workspace) mirrors this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
strip = true
codegen-units = 1
